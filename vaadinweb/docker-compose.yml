version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vaadin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ComidaRapida
      MYSQL_USER: IW
      MYSQL_PASSWORD: LOLALOLITA
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vaadin-net

  app:
    build:
      context: .
    image: vaadin_app:latest
    container_name: vaadin_app
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ComidaRapida
      SPRING_DATASOURCE_USERNAME: IW
      SPRING_DATASOURCE_PASSWORD: LOLALOLITA
    networks:
      - vaadin-net

volumes:
  mysql-data:

networks:
  vaadin-net:
